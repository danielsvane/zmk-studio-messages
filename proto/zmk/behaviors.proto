syntax = "proto3";

package zmk.behaviors;

message Request {
    oneof request_type {
        bool list_all_behaviors = 1;
        GetBehaviorDetailsRequest get_behavior_details = 2;
        bool get_custom_behaviors = 3;
        SetCustomBehaviorRequest set_custom_behavior = 4;
    }
}

message GetBehaviorDetailsRequest {
    uint32 behavior_id = 1;
}

message Response {
    oneof response_type {
        ListAllBehaviorsResponse list_all_behaviors = 1;
        GetBehaviorDetailsResponse get_behavior_details = 2;
        CustomBehaviors get_custom_behaviors = 3;
        SetCustomBehaviorResponse set_custom_behavior = 4;
    }
}

// The pool of runtime-configurable custom behaviour instances. Modeled on
// combos' Combos response. `max` is the pool capacity (reported for later
// milestones' "X of N slots used" UI; 0 until M2 wires the real pool).
message CustomBehaviors {
    repeated CustomBehavior behaviors = 1;
    uint32 max = 2;
}

// A single custom behaviour instance, described generically. `kind` names the
// devicetree behaviour family (e.g. "hold-tap"); `config` is the typed,
// schema-carrying field list the frontend renders without knowing the kind.
// M1 returns one hardcoded fake; M2 replaces it with real pool slots.
message CustomBehavior {
    uint32 id = 1;            // behaviour local_id (stable across reboot — NVS key)
    string display_name = 2;
    string kind = 3;          // the DT compatible family, e.g. "hold-tap"
    repeated ConfigField config = 4;
}

// Edit the config of the custom behaviour with local_id `id`, in place (M3:
// RAM-only, lost on reboot). `config` carries the edited fields as the same
// generic ConfigField used in the get_custom_behaviors response; the firmware
// matches each by `key` against the kind's schema descriptor and writes the
// `value` into the slot's RAM config (it ignores `schema`/`display_name` on a
// set — those are response-only). Mirrors combos' SetComboRequest.
message SetCustomBehaviorRequest {
    uint32 id = 1;                  // behaviour local_id (the slot to edit)
    repeated ConfigField config = 2;
}

// Result of set_custom_behavior. NOT_FOUND: no runtime slot has that local_id.
// INVALID_PARAMETERS: a field's value was out of its schema's bounds.
enum SetCustomBehaviorResponse {
    SET_CUSTOM_BEHAVIOR_RESP_OK = 0;
    SET_CUSTOM_BEHAVIOR_RESP_NOT_FOUND = 1;
    SET_CUSTOM_BEHAVIOR_RESP_INVALID_PARAMETERS = 2;
}

// One editable config field of a custom behaviour. Carries BOTH the current
// `value` and a `schema` describing how to render/validate it, so the frontend
// renderer is entirely kind-agnostic. ConfigField's leaf fields are nanopb
// static (see behaviors.options.in) so the SAME message round-trips through the
// get_custom_behaviors response encode AND (from M3) a set request decode.
message ConfigField {
    string key = 1;            // stable machine key, e.g. "tapping_term_ms"
    string display_name = 2;   // human label, e.g. "Tapping term (ms)"
    ConfigValue value = 3;     // current value
    ConfigSchema schema = 4;   // how to render / validate it
}

// The current value of a config field. The set tag mirrors the schema oneof.
message ConfigValue {
    oneof v {
        int32 int_value = 1;
        bool bool_value = 2;
        uint32 enum_value = 3;        // index into the schema's enum names
        KeyPositions positions = 4;
        BehaviorRef behavior_ref = 5; // for hold/tap sub-bindings
        uint32 hid_usage = 6;
    }
}

// How to render and bound a config field. One variant per ConfigValue variant.
message ConfigSchema {
    oneof s {
        IntRange int_range = 1;          // bounded integer
        EnumOptions enum_options = 2;    // pick-one from named options
        BoolSchema bool_schema = 3;      // toggle
        KeyPositionArray positions = 4;  // a set of key positions
        BehaviorRefSchema behavior_ref = 5;
    }
}

message IntRange { int32 min = 1; int32 max = 2; }
message EnumOptions { repeated string names = 1; }   // .options.in: max_count/max_size
message BoolSchema {}
message KeyPositionArray { uint32 max = 1; }
message BehaviorRefSchema {}

message KeyPositions { repeated uint32 positions = 1; } // .options.in: max_count
message BehaviorRef { uint32 behavior_id = 1; }

message ListAllBehaviorsResponse {
    repeated uint32 behaviors = 1;
}

message GetBehaviorDetailsResponse {
    uint32 id = 1;
    string display_name = 2;
    repeated BehaviorBindingParametersSet metadata = 3;
}

message BehaviorBindingParametersSet {
    repeated BehaviorParameterValueDescription param1 = 1;
    repeated BehaviorParameterValueDescription param2 = 2;
}

message BehaviorParameterValueDescriptionRange {
    int32 min = 1;
    int32 max = 2;
}

message BehaviorParameterNil {}
message BehaviorParameterLayerId {}
message BehaviorParameterHidUsage {
	uint32 keyboard_max = 1;
	uint32 consumer_max = 2;
}

message BehaviorParameterValueDescription {
    string name = 1;

    oneof value_type {
        BehaviorParameterNil nil = 2;
        uint32 constant = 3;
        BehaviorParameterValueDescriptionRange range = 4;
        BehaviorParameterHidUsage hid_usage = 5;
        BehaviorParameterLayerId layer_id = 6;
    }
}
