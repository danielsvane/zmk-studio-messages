syntax = "proto3";

package zmk.combos;

import "keymap.proto";

message Request {
    oneof request_type {
        bool get_combos = 1;
        SetComboRequest set_combo = 2;
        bool check_unsaved_changes = 3;
        bool save_changes = 4;
        bool discard_changes = 5;
        AddComboRequest add_combo = 6;
        RemoveComboRequest remove_combo = 7;
    }
}

message Response {
    oneof response_type {
        Combos get_combos = 1;
        SetComboResponse set_combo = 2;
        bool check_unsaved_changes = 3;
        SaveChangesResponse save_changes = 4;
        bool discard_changes = 5;
        AddComboResponse add_combo = 6;
        RemoveComboResponse remove_combo = 7;
    }
}

message Notification {
    oneof notification_type {
        bool unsaved_changes_status_changed = 1;
    }
}

// A single combo definition. Modeled on keymap's Layer/BehaviorBinding so the
// frontend can reuse the existing behavior-display + behavior-picker machinery.
message Combo {
    // key_positions is a nanopb static array (see combos.options.in) so it
    // round-trips through both the get_combos response encode AND the set_combo
    // request decode without per-field callbacks (the RPC framework decodes
    // requests generically with no callback setup).
    repeated int32 key_positions = 1;
    // Bitmask of layers the combo is active on. 0 = all layers.
    uint32 layers = 2;
    zmk.keymap.BehaviorBinding binding = 3;
    // sint32 (zigzag): timeout_ms and require_prior_idle_ms are commonly small or
    // -1 ("disabled"). Plain int32 encodes a negative as a 10-byte varint; sint32
    // encodes -1 as a single byte, shrinking set_combo/add_combo requests (and the
    // RX-buffer pressure flagged in A6 / the M2 RX-buffer fix). Transparent to the
    // firmware (still int32_t) and the TS client (still number).
    sint32 timeout_ms = 4;
    sint32 require_prior_idle_ms = 5;
    bool slow_release = 6;
}

// Pairs a combo with its stable pool index (== virtual-key-position arg ==
// NVS key). Indexes are not necessarily contiguous once add/delete land.
message ComboEntry {
    uint32 index = 1;
    Combo combo = 2;
}

message Combos {
    repeated ComboEntry combos = 1;
    uint32 max_combos = 2;
    uint32 max_keys_per_combo = 3;
}

// Edit the combo occupying pool slot `index` in place (M2: RAM-only, lost on
// reboot). Mirrors keymap's SetLayerBindingRequest.
message SetComboRequest {
    uint32 index = 1;
    Combo combo = 2;
}

// Create a brand-new combo (M4). The firmware places it in the lowest free pool
// slot and returns the assigned index. Mirrors keymap's AddLayerRequest, but
// carries the full combo to create (unlike layers, a combo isn't useful empty).
message AddComboRequest {
    Combo combo = 1;
}

message AddComboResponse {
    oneof result {
        AddComboResponseDetails ok = 1;
        AddComboErrorCode err = 2;
    }
}

message AddComboResponseDetails {
    uint32 index = 1;
    Combo combo = 2;
}

enum AddComboErrorCode {
    ADD_COMBO_ERR_OK = 0;
    ADD_COMBO_ERR_GENERIC = 1;
    ADD_COMBO_ERR_NO_SPACE = 2;
    ADD_COMBO_ERR_INVALID_PARAMETERS = 3;
}

// Delete the combo occupying pool slot `index` (M4). Mirrors keymap's
// RemoveLayerRequest.
message RemoveComboRequest {
    uint32 index = 1;
}

message RemoveComboResponse {
    oneof result {
        RemoveComboOk ok = 1;
        RemoveComboErrorCode err = 2;
    }
}

message RemoveComboOk {
}

enum RemoveComboErrorCode {
    REMOVE_COMBO_ERR_OK = 0;
    REMOVE_COMBO_ERR_GENERIC = 1;
    REMOVE_COMBO_ERR_INVALID_INDEX = 2;
}

enum SetComboResponse {
    SET_COMBO_RESP_OK = 0;
    SET_COMBO_RESP_INVALID_LOCATION = 1;
    SET_COMBO_RESP_INVALID_BEHAVIOR = 2;
    SET_COMBO_RESP_INVALID_PARAMETERS = 3;
}

// Result of save_changes. Mirrors keymap's SaveChangesResponse so the frontend
// can reuse the same error handling. NO_SPACE surfaces a full NVS partition.
message SaveChangesResponse {
    oneof result {
        bool ok = 1;
        SaveChangesErrorCode err = 2;
    }
}

enum SaveChangesErrorCode {
    SAVE_CHANGES_ERR_OK = 0;
    SAVE_CHANGES_ERR_GENERIC = 1;
    SAVE_CHANGES_ERR_NOT_SUPPORTED = 2;
    SAVE_CHANGES_ERR_NO_SPACE = 3;
}
