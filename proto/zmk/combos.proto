syntax = "proto3";

package zmk.combos;

message Request {
    oneof request_type {
        bool get_combos = 1;
    }
}

message Response {
    oneof response_type {
        Combos get_combos = 1;
    }
}

message Notification {
    oneof notification_type {
        bool unsaved_changes_status_changed = 1;
    }
}

// Milestone 0 walking-skeleton: empty container. Fleshed out in Milestone 1
// with `repeated ComboEntry combos`, `max_combos`, `max_keys_per_combo`.
message Combos {
}
